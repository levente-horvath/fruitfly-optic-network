<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev vs the Fly</title>
<style>
  :root {
    --surface: #fcfcfb; --panel: #f4f3ef; --grid: #e1e0d9; --axis: #c3c2b7;
    --muted: #898781; --secondary: #52514e; --primary: #0b0b0b;
    --jev: #eb6834; --fly: #2a78d6; --dark-square: #d8d6cd; --light-square: #f4f3ef;
    --move: rgba(11, 11, 11, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #161615; --panel: #1f1f1d; --grid: #2e2e2b; --axis: #4a4945;
      --muted: #8f8e88; --secondary: #bdbcb5; --primary: #f2f1ee;
      --jev: #f07a4a; --fly: #4a8fe0; --dark-square: #3a3935; --light-square: #24241f;
      --move: rgba(255, 255, 255, .12);
    }
  }
  :root[data-theme="dark"] {
    --surface: #161615; --panel: #1f1f1d; --grid: #2e2e2b; --axis: #4a4945;
    --muted: #8f8e88; --secondary: #bdbcb5; --primary: #f2f1ee;
    --jev: #f07a4a; --fly: #4a8fe0; --dark-square: #3a3935; --light-square: #24241f;
    --move: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; background: var(--surface);
         color: var(--primary); }
  main { max-width: 1060px; margin: 0 auto; padding: 24px 16px 40px; display: grid;
         grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 32px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--secondary); line-height: 1.5; margin: 0 0 16px; }
  .who { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.jev { background: var(--jev); } .dot.fly { background: var(--fly); }

  .board { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--axis);
           aspect-ratio: 1; width: 100%; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; }
  .sq.light { background: var(--light-square); }
  .sq.dark { background: var(--dark-square); }
  .sq.moved { box-shadow: inset 0 0 0 100px var(--move); }
  .sq .num { position: absolute; top: 2px; left: 4px; font-size: 9px; color: var(--muted); }
  .piece { width: 74%; height: 74%; border-radius: 50%; display: flex; align-items: center;
           justify-content: center; transition: transform .15s; }
  .piece.jev { background: var(--jev); } .piece.fly { background: var(--fly); }
  .piece.king::after { content: ""; width: 44%; height: 44%; border-radius: 50%;
                       border: 3px solid var(--surface); }
  .piece.taken { background: transparent; border: 2px dashed var(--muted); }
  .piece.taken.king::after { display: none; }
  .ghost { width: 22%; height: 22%; border-radius: 50%; background: var(--muted); opacity: .6; }

  .controls { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--axis);
           background: var(--surface); color: var(--secondary); border-radius: 6px; cursor: pointer; }
  button:hover { color: var(--primary); border-color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--secondary); min-width: 0; }
  .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 70px;
           text-align: right; }
  .material { display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary);
              margin-top: 10px; }

  h2 { font-size: 14px; margin: 0 0 4px; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.45; }
  .status { font-size: 15px; margin: 0 0 14px; min-height: 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; padding: 6px 0;
       border-bottom: 1px solid var(--grid); }
  td { padding: 5px 0; color: var(--secondary); border-bottom: 1px solid var(--grid); vertical-align: middle; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; width: 64px; }
  td.label { width: 90px; font-variant-numeric: tabular-nums; }
  tr.chosen td { color: var(--primary); font-weight: 600; }
  .bar { height: 8px; border-radius: 0 4px 4px 0; display: block; min-width: 2px; }
  .bar.jev { background: var(--jev); } .bar.fly { background: var(--fly); }
  .saw { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; margin-top: 22px; }
  .saw .board { width: 180px; }
  .saw .sq.wrong { box-shadow: inset 0 0 0 2px var(--primary); }
  .log { margin-top: 22px; font-size: 12px; color: var(--secondary); line-height: 1.9;
         max-height: 180px; overflow-y: auto; }
  .log span { cursor: pointer; padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
  .log span.jev { border-left: 3px solid var(--jev); }
  .log span.fly { border-left: 3px solid var(--fly); }
  .log span.here { background: var(--panel); color: var(--primary); font-weight: 600; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>
<main>
  <section>
    <h1>Jev vs the Fly</h1>
    <p class="sub" id="sub"></p>
    <div class="board" id="board" role="img" aria-label="checkers board"></div>
    <div class="material" id="material"></div>
    <div class="controls">
      <button id="prev" aria-label="previous move">◀</button>
      <button id="play">Play</button>
      <button id="next" aria-label="next move">▶</button>
      <input type="range" id="slider" min="0" value="0" aria-label="move">
      <span class="count" id="count"></span>
    </div>
    <div class="log" id="log"></div>
  </section>
  <section>
    <p class="status" id="status"></p>
    <div id="decision"></div>
  </section>
</main>

<script>
const game = JSON.parse(document.getElementById("game").textContent);
const plies = game.plies;
const N = plies.length;
const NAME = { jev: "Jev", fly: "The fly" };

// Squares 0-31 in the first mover's frame: row = s/4, dark squares only (as fly_sim.checkers).
const rowcol = s => { const r = Math.floor(s / 4); return [r, 2 * (s % 4) + (1 - r % 2)]; };
const at = {};
for (let s = 0; s < 32; s++) at[rowcol(s).join(",")] = s;
const label = path => path.map(s => s + 1).join(path.length > 2 || Math.abs(rowcol(path[0])[0] - rowcol(path[1])[0]) === 2 ? "x" : "-");
const boardAfter = i => (i + 1 < N ? plies[i + 1].board : game.final);  // board once ply i is played
const owner = c => (c === 1 || c === 2 ? "jev" : c ? "fly" : null);

function drawBoard(el, codes, opts = {}) {
  el.innerHTML = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const sq = document.createElement("div");
    const s = at[r + "," + c];
    sq.className = "sq " + (s === undefined ? "light" : "dark");
    if (s !== undefined) {
      if (opts.numbers) { const n = document.createElement("span"); n.className = "num"; n.textContent = s + 1; sq.appendChild(n); }
      if (opts.path && opts.path.includes(s)) sq.classList.add("moved");
      if (opts.wrong && opts.wrong.has(s)) sq.classList.add("wrong");
      const code = codes[s];
      if (code) {
        const p = document.createElement("div");
        p.className = "piece " + owner(code) + (code === 2 || code === 4 ? " king" : "");
        sq.appendChild(p);
      } else if (opts.taken && opts.taken[s]) {
        const p = document.createElement("div");
        p.className = "piece taken" + (opts.taken[s] % 2 === 0 ? " king" : "");
        sq.appendChild(p);
      } else if (opts.path && opts.path.slice(1, -1).includes(s)) {
        const g = document.createElement("div"); g.className = "ghost"; sq.appendChild(g);
      }
    }
    el.appendChild(sq);
  }
}

const count = (codes, who) => {
  const men = codes.filter(c => c === (who === "jev" ? 1 : 3)).length;
  const kings = codes.filter(c => c === (who === "jev" ? 2 : 4)).length;
  return `${men} men${kings ? ` + ${kings} king${kings > 1 ? "s" : ""}` : ""}`;
};

const outcome = game.winner ? `${NAME[game.winner]} won` : "a draw (60 moves with no capture or crowning)";
document.getElementById("sub").innerHTML =
  `<span class="who"><span class="dot jev"></span>Jev (${game.model}${game.hints ? ", with capture hints" : ""})</span> &nbsp;vs&nbsp; ` +
  `<span class="who"><span class="dot fly"></span>the fly's right optic lobe</span>. ` +
  `${NAME[game.order[0]]} moved first, from the bottom. ${N} moves, ${outcome}.`;

const slider = document.getElementById("slider");
slider.max = N;
const log = document.getElementById("log");
plies.forEach((p, i) => {
  const s = document.createElement("span");
  s.className = p.mover;
  s.textContent = `${i + 1}. ${label(p.path)}`;
  s.onclick = () => show(i + 1);
  log.appendChild(s);
  log.appendChild(document.createTextNode(" "));
});

let step = 0;
function show(k) {
  step = Math.max(0, Math.min(N, k));
  slider.value = step;
  document.getElementById("count").textContent = `${step} / ${N}`;
  [...log.children].forEach((el, i) => el.classList.toggle("here", i === step - 1));
  const here = log.children[step - 1];
  if (here) here.scrollIntoView({ block: "nearest" });

  const status = document.getElementById("status");
  const decision = document.getElementById("decision");
  if (step === 0) {
    drawBoard(document.getElementById("board"), plies[0].board, { numbers: true });
    status.innerHTML = "Starting position.";
    decision.innerHTML = `<p class="note">Press ▶ or the right arrow key to step through the game. Each step shows
      the move played and how the player chose it: Jev's probability for every legal move, or the fly's
      evaluator score for every legal move after its eye has looked at the resulting board.</p>`;
    setMaterial(plies[0].board);
    return;
  }
  const p = plies[step - 1];
  const after = boardAfter(step - 1);
  const taken = {};
  p.captured.forEach(s => { taken[s] = p.board[s]; });
  drawBoard(document.getElementById("board"), after, { numbers: true, path: p.path, taken });
  setMaterial(after);

  const took = p.captured.length ? `, taking ${p.captured.length}` : "";
  const end = step === N ? ` — game over: ${outcome}.` : "";
  status.innerHTML = `<span class="who"><span class="dot ${p.mover}"></span><b>${NAME[p.mover]}</b></span> plays <b>${label(p.path)}</b>${took}${end}`;

  const chosen = label(p.path);
  const isJev = p.mover === "jev";
  const values = p.options.map(o => (isJev ? o.p : o.score));
  const lo = Math.min(...values), hi = Math.max(...values);
  const width = v => (isJev ? v * 100 : (hi > lo ? 8 + 92 * (v - lo) / (hi - lo) : 100));
  const rows = p.options
    .map(o => ({ l: label(o.path), v: isJev ? o.p : o.score }))
    .sort((a, b) => b.v - a.v)
    .map(o => `<tr class="${o.l === chosen ? "chosen" : ""}"><td class="label">${o.l}${o.l === chosen ? " ◂" : ""}</td>
      <td><span class="bar ${p.mover}" style="width:${width(o.v).toFixed(1)}%"></span></td>
      <td class="n">${isJev ? (o.v * 100).toFixed(0) + "%" : o.v.toFixed(1)}</td></tr>`).join("");
  const heading = isJev ? "Jev's choice" : "The fly's choice";
  const note = p.options.length === 1 ? "Only one legal move, so nobody was asked." : isJev
    ? "Jev is shown the board and every legal move, and returns a probability for each. It plays its top pick."
    : "Each afterstate is drawn, shown to the right optic lobe for 0.6 s, decoded back off its output neurons and scored. Forced captures are played out first. Higher is better for the fly.";
  let html = `<h2>${heading}</h2><p class="note">${note}</p>
    <table><tr><th>move</th><th>${isJev ? "probability" : "evaluator score (relative)"}</th><th></th></tr>${rows}</table>`;

  if (p.fly_saw) {
    const wrong = new Set();
    for (let s = 0; s < 32; s++) if (p.fly_saw[s] !== after[s]) wrong.add(s);
    html += `<div class="saw"><div class="board" id="saw"></div><div>
      <h2>What the eye read</h2>
      <p class="note">The board after the fly's move, as decoded from its 4,611 visual projection neurons.
      ${wrong.size ? `${wrong.size} square${wrong.size > 1 ? "s" : ""} misread (outlined).` : "Every square read correctly."}</p></div></div>`;
    decision.innerHTML = html;
    drawBoard(document.getElementById("saw"), p.fly_saw, { wrong });
  } else {
    decision.innerHTML = html;
  }
}

function setMaterial(codes) {
  document.getElementById("material").innerHTML =
    `<span class="who"><span class="dot jev"></span>Jev: ${count(codes, "jev")}</span>` +
    `<span class="who"><span class="dot fly"></span>Fly: ${count(codes, "fly")}</span>`;
}

let timer = null;
const playBtn = document.getElementById("play");
function toggle() {
  if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "Play"; return; }
  if (step >= N) show(0);
  playBtn.textContent = "Pause";
  timer = setInterval(() => { if (step >= N) toggle(); else show(step + 1); }, 900);
}
playBtn.onclick = toggle;
document.getElementById("prev").onclick = () => show(step - 1);
document.getElementById("next").onclick = () => show(step + 1);
slider.oninput = () => show(+slider.value);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show(step + 1);
  else if (e.key === "ArrowLeft") show(step - 1);
  else if (e.key === " ") { e.preventDefault(); toggle(); }
});
show(0);
</script>
</body>
</html>
