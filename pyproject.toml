[project]
name = "fly-sim"
version = "0.1.0"
description = "Simulations on the Drosophila male CNS connectome"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fly_sim"]
